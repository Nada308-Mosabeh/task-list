<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card mb-4">
        <div class="card-header">
            New Task
        </div>

        <div class="card-body">

            <form>
                <div class="mb-3">
                    <label class="form-label">Task</label>

                    <input type="text" class="form-control">
                </div>

                <button class="btn btn-primary">
                    + Add Task
                </button>
            </form>

        </div>
    </div>

    <div class="card">
        <div class="card-header">
            Current Tasks
        </div>

        <div class="card-body">

            <table class="table">

                <thead>
                    <tr>
                        <th>Task</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>Task 1</td>

                        <td>
                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td>Task 2</td>

                        <td>
                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td>Task 3</td>

                        <td>
                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
